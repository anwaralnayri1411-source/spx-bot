name: Telegram Commands
on:
  schedule:
    - cron: "3,18,33,48 13-21 * * 1-5"    # كل ربع ساعة أثناء الجلسة
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: commands-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests numpy playwright
      - run: python commands_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save state
        run: |
          git config user.name "spx-bot"
          git config user.email "bot@users.noreply.github.com"
          git add commands_state.json messages_commands_bot.jsonl || true
          git diff --cached --quiet || (git commit -m "update commands state" && (git pull --rebase && git push || (sleep 5 && git pull --rebase && git push)))
