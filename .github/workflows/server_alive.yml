name: Server Alive Check

# فحص من خارج الخادم: تنبيه إن توقف خادم Hetzner كله أثناء الجلسة (deploy/server_alive_check.py).
# لا يكرر أي مهمة من مهام الخادم، فلا رسائل مكررة. التنبيه إلى TELEGRAM_CHAT_ID وحده.
on:
  schedule:
    - cron: "15,45 13-20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-alive
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python deploy/server_alive_check.py
