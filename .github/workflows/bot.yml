name: SPX Signals
on:
  schedule:
    - cron: "5,35 13-20 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: spx-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests numpy
      - run: python options_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      - name: Save state and log
        run: |
          git config user.name "spx-bot"
          git config user.email "bot@users.noreply.github.com"
          git add zero_dte_log.csv || true
          git add messages_options_bot.jsonl || true
          git add bot_state.json || true
          git add spx_positions.json spx_track.csv || true
          git diff --cached --quiet || (git commit -m "update bot state" && (git pull --rebase && git push || (sleep 5 && git pull --rebase && git push)))
