name: SPX Backtest
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: spx-backtest
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy
      - run: python research/backtest_spx.py
      - name: Save results and bar cache
        run: |
          git config user.name "spx-bot"
          git config user.email "bot@users.noreply.github.com"
          git add research/backtest_spx_results.md research/spx_5m_cache.csv || true
          git diff --cached --quiet || (git commit -m "backtest results" && (git pull --rebase && git push || (sleep 5 && git pull --rebase && git push)))
