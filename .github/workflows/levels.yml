name: Levels
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: levels
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests numpy
      - run: python levels.py --compare
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_EXTRA_CHAT_IDS: ${{ secrets.TELEGRAM_EXTRA_CHAT_IDS }}
      - run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          for f in levels_log.csv mgt_compare_log.csv messages_options_bot.jsonl; do git add "$f" 2>/dev/null || true; done
          git commit -m "levels log" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 3; done
# v2
