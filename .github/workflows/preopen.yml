name: Pre-open Brief
on:
  # المواعيد انتقلت إلى الخادم (deploy/run_job.sh + deploy/install.sh) منذ 21/10/2026؛ التشغيل اليدوي باقٍ احتياطاً.
#  schedule:
#    # مواعيد احتياطية بعيداً عن بداية الساعة (GitHub يؤخر :00 كثيراً). أول تشغيل داخل النافذة 8:40–9:40 نيويورك يرسل،
#    # والباقي يتوقف لأن التقرير أُرسل (sent_today). الوقت الخاطئ موسمياً يتجاهله الكود.
#    - cron: "41 12 * * 1-5"    # 8:41 صيفاً
#    - cron: "3,23 13 * * 1-5"  # 9:03 و9:23 صيفاً / 8:03 و8:23 شتاءً (تُتجاهل)
#    - cron: "41 13 * * 1-5"    # 8:41 شتاءً
#    - cron: "3,23 14 * * 1-5"  # 9:03 و9:23 شتاءً
  workflow_dispatch:
    inputs:
      resend:
        description: "إعادة الإرسال حتى لو أُرسل تقرير اليوم (yes/no)"
        default: "no"
permissions:
  contents: write
concurrency:
  group: preopen-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests numpy
      - name: Sync to latest
        # التشغيل المجدول يبدأ من نسخة وقت الجدولة؛ نأخذ آخر نسخة ليرى سجل رسائل اليوم ولا يكرر التقرير
        run: git pull --rebase || true
      - run: python preopen_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_EXTRA_CHAT_IDS: ${{ secrets.TELEGRAM_EXTRA_CHAT_IDS }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          RESEND: ${{ github.event.inputs.resend == 'yes' && '1' || '0' }}
      - name: Save message log
        run: |
          git config user.name "spx-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in messages_preopen_bot.jsonl levels_log.csv mgt_compare_log.csv; do git add "$f" 2>/dev/null || true; done
          git diff --cached --quiet || (git commit -m "update preopen messages" && (git pull --rebase && git push || (sleep 5 && git pull --rebase && git push)))
