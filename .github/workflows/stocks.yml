name: Stocks Signals
on:
  schedule:
    - cron: "20 14,15 * * 1-5"
    - cron: "0 17,19 * * 1-5"
    - cron: "12,42 13-21 * * 1-5"   # كل نصف ساعة: بحث عن أفكار (داخل نافذة الفحص) + متابعة العقود المفتوحة
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stocks-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests numpy playwright
      - run: python stocks_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_EXTRA_CHAT_IDS: ${{ secrets.TELEGRAM_EXTRA_CHAT_IDS }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          LIVE_QUOTES_STOCKS: ${{ vars.LIVE_QUOTES_STOCKS || 'shadow' }}   # ظل لحظي: shadow تسجيل فقط، 0 إيقاف
          # كل التشغيلات بوضع scan (بحث + متابعة). هذا هو السلوك الذي أنتج نتائج الشركات حتى 17/10.
          # لجعل تشغيلات نصف الساعة متابعة فقط: 'monitor' عند github.event.schedule == '12,42 13-21 * * 1-5'
          BOT_MODE: scan
      - name: Save state and log
        run: |
          git config user.name "spx-bot"
          git config user.email "bot@users.noreply.github.com"
          git add stocks_log.csv || true
          git add stocks_track.csv || true
          git add messages_stocks_bot.jsonl || true
          git add stocks_state.json || true
          git add stocks_positions.json || true
          git add stocks_shadow_log.csv || true
          git add stocks_flow_log.csv || true
          git add live_quotes_stocks_log.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update stocks state" && (git pull --rebase && git push || (sleep 5 && git pull --rebase && git push)))
