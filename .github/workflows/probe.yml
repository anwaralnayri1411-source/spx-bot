name: Probe
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: probe
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests numpy
      - run: python probe.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add messages_*.jsonl 2>/dev/null || true
          git commit -m "report log" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 3; done
