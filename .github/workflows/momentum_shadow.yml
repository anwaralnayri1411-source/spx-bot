name: Momentum Shadow
# ظل «زخم 30 دقيقة» لـ SPX بأسعار Alpaca اللحظية. تسجيل فقط: لا رسائل، ولا يقرأ أو يعدّل أي ملف من ملفات البوت.
# مهمة طويلة تفحص كل دقيقة (بدل تشغيل كل 5 دقائق يؤخره GitHub إلى 30–40 دقيقة). مواعيد بداية احتياطية: أول موعد يعمل
# يبقى حتى 16:05 نيويورك أو ~5:45 ساعة، واللاحقة تنتظر دورها (واحد منتظر فقط) فتكمل الجلسة. يتوقف بعد END_DATE.
on:
  # المواعيد انتقلت إلى الخادم (deploy/run_job.sh + deploy/install.sh) منذ 21/10/2026؛ التشغيل اليدوي باقٍ احتياطاً.
#  schedule:
#    - cron: "0,20,40 12,13,14 * * 1-5"   # بدايات احتياطية (صيفي 8:00–10:40، شتوي 7:00–9:40 نيويورك)
#    - cron: "0,30 17,18,19 * * 1-5"      # احتياط للنصف الثاني
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: momentum-shadow
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - name: Sync to latest
        run: git pull --rebase
      - name: Watch every minute until close
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          PYTHONUNBUFFERED: "1"
        run: python research/momentum_shadow.py --loop
      - name: Save shadow log
        if: always()
        run: |
          python research/momentum_shadow.py --report || true
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          for f in momentum_shadow_state.json momentum_shadow_log.csv research/momentum_shadow_results.md; do git add "$f" 2>/dev/null || true; done
          git diff --cached --quiet && exit 0
          git commit -m "momentum shadow log"
          for i in 1 2 3 4 5; do if git pull --rebase; then git push && break; else git rebase --abort; fi; sleep 5; done
