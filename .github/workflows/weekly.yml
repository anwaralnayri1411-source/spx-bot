name: Weekly Report
on:
  # المواعيد انتقلت إلى الخادم (deploy/run_job.sh + deploy/install.sh) منذ 21/10/2026؛ التشغيل اليدوي باقٍ احتياطاً.
#  schedule:
#    - cron: "30 21 * * 5"     # الجمعة بعد الإغلاق صيفاً وشتاءً
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weekly
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests numpy
      - run: python weekly.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_EXTRA_CHAT_IDS: ${{ secrets.TELEGRAM_EXTRA_CHAT_IDS }}
      - run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add messages_*.jsonl 2>/dev/null || true
          git commit -m "weekly report log" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 3; done
