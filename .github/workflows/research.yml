name: Research Overnight
on:
  workflow_dispatch:
  push:
    paths:
      - "research/overnight.py"
      - ".github/workflows/research.yml"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy
      - run: python research/overnight.py
      - name: Save results
        run: |
          git config user.name "spx-bot"
          git config user.email "bot@users.noreply.github.com"
          git add research/overnight_results.md || true
          git diff --cached --quiet || (git commit -m "research results" && (git pull --rebase && git push || (sleep 5 && git pull --rebase && git push)))
